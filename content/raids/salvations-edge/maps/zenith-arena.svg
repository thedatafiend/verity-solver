<svg viewBox="0 0 860 600" role="img" aria-label="Top-down schematic of the Zenith arena">
  <!-- Witness -->
  <g transform="translate(430,84)">
    <path d="M0 -44 L34 10 L20 44 L-20 44 L-34 10 Z" fill="#17171b" stroke="#f2913a" stroke-width="2.5"/>
    <text x="0" y="8" fill="#f2913a" font-size="15" font-weight="800" text-anchor="middle">WITNESS</text>
    <text x="0" y="66" fill="#9a9aa6" font-size="11.5" text-anchor="middle">6 glyphs on chest · crit opens for DPS</text>
  </g>
  <!-- V shape arena -->
  <path d="M130 160 L340 560 L520 560 L730 160" fill="none" stroke="#2c2c33" stroke-width="2"/>
  <!-- halves -->
  <text x="205" y="330" fill="#b79bff" font-size="14" font-weight="800" transform="rotate(60 205 330)">LEFT HALF · hands</text>
  <text x="655" y="330" fill="#b79bff" font-size="14" font-weight="800" transform="rotate(-60 655 330)">RIGHT HALF · hands</text>
  <!-- hands -->
  <g fill="#17171b" stroke="#b79bff" stroke-width="2">
    <circle cx="255" cy="255" r="26"/>
    <circle cx="605" cy="255" r="26"/>
  </g>
  <text x="255" y="260" fill="#b79bff" font-size="11" text-anchor="middle">hand</text>
  <text x="605" y="260" fill="#b79bff" font-size="11" text-anchor="middle">hand</text>
  <text x="255" y="300" fill="#9a9aa6" font-size="10.5" text-anchor="middle">bracelet: Y/R/G</text>
  <text x="605" y="300" fill="#9a9aa6" font-size="10.5" text-anchor="middle">bracelet: Y/R/G</text>
  <!-- central island -->
  <circle cx="430" cy="250" r="44" fill="#1d1d21" stroke="#f2913a" stroke-width="2.5"/>
  <text x="430" y="245" fill="#f2913a" font-size="12" font-weight="700" text-anchor="middle">well of</text>
  <text x="430" y="260" fill="#f2913a" font-size="12" font-weight="700" text-anchor="middle">Light</text>
  <text x="430" y="316" fill="#9a9aa6" font-size="10.5" text-anchor="middle">Glyphbreakers shoot from here ·</text>
  <text x="430" y="330" fill="#9a9aa6" font-size="10.5" text-anchor="middle">platform rises for DPS</text>
  <!-- test grid -->
  <g fill="none" stroke="#6fe3a0" stroke-width="1.6">
    <circle cx="394" cy="392" r="7"/><circle cx="418" cy="392" r="7"/><circle cx="442" cy="392" r="7"/><circle cx="466" cy="392" r="7"/>
    <circle cx="394" cy="416" r="7"/><circle cx="418" cy="416" r="7"/><circle cx="442" cy="416" r="7"/><circle cx="466" cy="416" r="7"/>
    <circle cx="394" cy="440" r="7"/><circle cx="418" cy="440" r="7"/><circle cx="442" cy="440" r="7"/><circle cx="466" cy="440" r="7"/>
    <circle cx="406" cy="464" r="7"/><circle cx="454" cy="464" r="7"/>
  </g>
  <text x="430" y="492" fill="#6fe3a0" font-size="11.5" text-anchor="middle" font-weight="700">Test: 14 nodes — shoot the excess, leave the called shape</text>
  <!-- subjugator spawns -->
  <text x="318" y="548" fill="#ff7a7a" font-size="11.5" text-anchor="end">⚠ Subjugators — back left</text>
  <text x="542" y="548" fill="#ff7a7a" font-size="11.5" text-anchor="start">back right ⚠</text>
  <!-- rally -->
  <text x="430" y="585" fill="#9a9aa6" font-size="12.5" text-anchor="middle" letter-spacing="2">— RALLY FLAG / ENTRANCE —</text>
</svg>
