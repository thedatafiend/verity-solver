<svg viewBox="0 0 860 600" role="img" aria-label="Top-down schematic of the Dissipation arena">
  <!-- defs -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a9aa6"/>
    </marker>
  </defs>
  <!-- Witness hand -->
  <text x="430" y="18" fill="#ff7a7a" font-size="15" text-anchor="middle" font-weight="700">Witness's hand — AoE circles below</text>
  <path d="M310 38 q120 -26 240 0" stroke="#6a2a2a" stroke-width="3" fill="none" stroke-dasharray="6 5"/>
  <!-- Boss field -->
  <rect x="230" y="60" width="400" height="240" rx="18" fill="#1d1d21" stroke="#2c2c33" stroke-width="2"/>
  <circle cx="330" cy="130" r="22" fill="none" stroke="#8a3a3a" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="540" cy="170" r="18" fill="none" stroke="#8a3a3a" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="430" y="88" fill="#9a9aa6" font-size="13" text-anchor="middle" letter-spacing="2">BOSS PIT</text>
  <!-- Herald -->
  <g transform="translate(430,135)">
    <path d="M0 -26 L20 8 L0 26 L-20 8 Z" fill="#f2913a"/>
    <text x="0" y="52" fill="#f2913a" font-size="15" font-weight="800" text-anchor="middle">HERALD</text>
  </g>
  <!-- Deposit chest -->
  <rect x="405" y="238" width="50" height="34" rx="6" fill="#221d10" stroke="#f2913a" stroke-width="2.5"/>
  <text x="430" y="292" fill="#f2913a" font-size="13" text-anchor="middle" font-weight="700">deposit chest</text>
  <text x="430" y="308" fill="#9a9aa6" font-size="11" text-anchor="middle">(appears after 3 locks)</text>
  <!-- Left wing -->
  <rect x="20" y="120" width="180" height="260" rx="14" fill="#141416" stroke="#2c2c33" stroke-width="2"/>
  <text x="110" y="148" fill="#b79bff" font-size="14" text-anchor="middle" font-weight="800" letter-spacing="1">LEFT WING</text>
  <rect x="88" y="170" width="44" height="76" rx="8" fill="#17171b" stroke="#b79bff" stroke-width="2.5"/>
  <text x="110" y="264" fill="#b79bff" font-size="12" text-anchor="middle">conduit</text>
  <rect x="42" y="296" width="34" height="34" rx="5" fill="#17171b" stroke="#6fe3a0" stroke-width="2"/>
  <rect x="144" y="296" width="34" height="34" rx="5" fill="#17171b" stroke="#6fe3a0" stroke-width="2"/>
  <path d="M84 313 H136" stroke="#9a9aa6" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="4 4"/>
  <text x="110" y="352" fill="#6fe3a0" font-size="11" text-anchor="middle">paired plates — send / catch</text>
  <!-- Right wing -->
  <rect x="660" y="120" width="180" height="260" rx="14" fill="#141416" stroke="#2c2c33" stroke-width="2"/>
  <text x="750" y="148" fill="#b79bff" font-size="14" text-anchor="middle" font-weight="800" letter-spacing="1">RIGHT WING</text>
  <rect x="728" y="170" width="44" height="76" rx="8" fill="#17171b" stroke="#b79bff" stroke-width="2.5"/>
  <text x="750" y="264" fill="#b79bff" font-size="12" text-anchor="middle">conduit</text>
  <rect x="682" y="296" width="34" height="34" rx="5" fill="#17171b" stroke="#6fe3a0" stroke-width="2"/>
  <rect x="784" y="296" width="34" height="34" rx="5" fill="#17171b" stroke="#6fe3a0" stroke-width="2"/>
  <path d="M724 313 H776" stroke="#9a9aa6" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="4 4"/>
  <text x="750" y="352" fill="#6fe3a0" font-size="11" text-anchor="middle">paired plates — send / catch</text>
  <!-- Middle wing -->
  <rect x="330" y="340" width="200" height="170" rx="14" fill="#141416" stroke="#2c2c33" stroke-width="2"/>
  <text x="430" y="368" fill="#b79bff" font-size="14" text-anchor="middle" font-weight="800" letter-spacing="1">MIDDLE WING</text>
  <rect x="408" y="384" width="44" height="64" rx="8" fill="#17171b" stroke="#b79bff" stroke-width="2.5"/>
  <text x="430" y="464" fill="#b79bff" font-size="12" text-anchor="middle">conduit</text>
  <rect x="352" y="470" width="30" height="30" rx="5" fill="#17171b" stroke="#6fe3a0" stroke-width="2"/>
  <rect x="478" y="470" width="30" height="30" rx="5" fill="#17171b" stroke="#6fe3a0" stroke-width="2"/>
  <path d="M388 485 H472" stroke="#9a9aa6" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="4 4"/>
  <!-- Knight lanes -->
  <path d="M240 330 q-60 20 -105 -10" stroke="#ff7a7a" stroke-width="2" fill="none" marker-end="url(#arr)" stroke-dasharray="3 5"/>
  <path d="M620 330 q60 20 105 -10" stroke="#ff7a7a" stroke-width="2" fill="none" marker-end="url(#arr)" stroke-dasharray="3 5"/>
  <text x="430" y="540" fill="#ff7a7a" font-size="12.5" text-anchor="middle">⚠ Ravenous Taken Knights push toward the plates — one touch = wipe</text>
  <!-- Spawn -->
  <text x="430" y="580" fill="#9a9aa6" font-size="13" text-anchor="middle" letter-spacing="2">— FIRETEAM SPAWN / REAR RIM —</text>
</svg>
